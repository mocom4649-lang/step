name: Build StepMultiplier Instant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Build Dylib and Deb
        run: |
          brew install ldid dpkg

          mkdir -p pkg/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p pkg/DEBIAN

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <CoreMotion/CoreMotion.h>
          #import <objc/runtime.h>

          static IMP orig_numberOfSteps;

          NSNumber* hooked_numberOfSteps(id self, SEL _cmd) {
              NSNumber *original = ((NSNumber* (*)(id, SEL))orig_numberOfSteps)(self, _cmd);
              return original ? @(original.integerValue * 3) : original;
          }

          __attribute__((constructor))
          static void init(void) {
              Class cls = objc_getClass("CMPedometerData");
              if (cls) {
                  Method m = class_getInstanceMethod(cls, @selector(numberOfSteps));
                  if (m) {
                      orig_numberOfSteps = method_setImplementation(m, (IMP)hooked_numberOfSteps);
                  }
              }
          }
          EOF

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -arch arm64e -isysroot "$SDK" -mios-version-min=15.0 -fobjc-arc -shared -framework Foundation -framework CoreMotion Tweak.m -o pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/StepMultiplier.dylib
          ldid -S pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/StepMultiplier.dylib

          cat << 'EOF' > pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/StepMultiplier.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>Filter</key>
            <dict>
              <key>Executables</key>
              <array>
                <string>healthd</string>
                <string>SpringBoard</string>
              </array>
            </dict>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > pkg/DEBIAN/control
          Package: com.custom.stepmultiplier
          Name: StepMultiplier
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: Multiply CoreMotion step count (3x)
          Maintainer: Custom
          Author: Custom
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000)
          EOF

          dpkg-deb -Zxz -b pkg StepMultiplier.deb

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: StepMultiplier-deb
          path: StepMultiplier.deb
